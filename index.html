
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fishillion - Daily Fishing Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎣 FISHILLION</h1>
    <p>THE DAILY FISHING CHALLENGE</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to Fishillion</h2>
      <p>7 questions. 25 seconds each.</p>
      <p>Can you come up with the rarest answers?</p>
      <button id="playButton">PLAY TODAY'S GAME</button>
    </section>

    <input id="answer" placeholder="Type your answer..." autocomplete="off">

  <button id="submitButton">SUBMIT ANSWER</button>

  <p id="feedback"></p>

  <div id="diveScene" hidden>
    <div class="water-label">UNDERWATER DEPTH</div>

    <div id="underwater">
      <div class="sunlight"></div>
      <div class="bubbles">° · ° · °</div>
      <div id="diver">🤿</div>
    </div>

    <h2 id="rarityName">COMMON</h2>
    <h3 id="depthScore">10 POINTS</h3>
    <p id="depthDescription">You are just below the surface.</p>
  </div>
</section>

    <section id="results" hidden>
      <h2>Challenge complete!</h2>
      <h1 id="score">0</h1>
      <p id="summary"></p>
      <button onclick="location.reload()">HOME</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
